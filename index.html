<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PASUBLI: A WEB-BASED RENTAL PLATFORM FOR APPAREL IN BICOL</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="header">
      <h1>PASUBLI</h1>
      <span>Rental System Module (Prototype)</span>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
      <!-- Stats Row -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">Total Products</div>
          <div class="stat-value blue" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Categories</div>
          <div class="stat-value green" id="statCategories">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Stock</div>
          <div class="stat-value yellow" id="statStock">—</div>
        </div>
      </div>

      <!-- Products Card -->
      <div class="card">
        <div class="card-title">Product List</div>

        <!-- Toolbar -->
        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            placeholder="Search by name, description, or lender..."
          />
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="casual-wear">Casual Wear</option>
            <option value="office-wear">Office Wear</option>
            <option value="formal-wear">Formal Wear</option>
            <option value="business-casual">Business Casual</option>
            <option value="sports">Sports</option>
            <option value="loungewear">Loungewear</option>
            <option value="others">Others</option>
          </select>
          <div class="toolbar-right">
            <button class="btn btn-primary" id="addBtn">+ Add Product</button>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Lender</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Date Added</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td
                  colspan="8"
                  style="text-align: center; padding: 30px; color: #64748b"
                >
                  Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <!-- /card -->
    </div>
    <!-- /container -->

    <!-- ===== ADD / EDIT MODAL ===== -->
    <div class="modal-overlay" id="formModal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="formModalTitle">Add New Product</h2>
          <button class="modal-close" onclick="closeFormModal()">×</button>
        </div>
        <div class="modal-body">
          <!-- Error alert -->
          <div class="alert alert-danger" id="formAlert"></div>

          <form id="productForm" onsubmit="return false;">
            <!-- Product Name -->
            <div class="form-group">
              <label>Product Name <span class="required">*</span></label>
              <input
                type="text"
                id="product_name"
                class="form-control"
                placeholder="e.g., Foldable Table"
                maxlength="150"
              />
              <div class="field-error" id="err_name"></div>
            </div>

            <!-- Category -->
            <div class="form-group">
              <label>Category <span class="required">*</span></label>
              <select id="category" class="form-control">
                <option value="">-- Select Category --</option>
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Appliances">Appliances</option>
                <option value="Tools">Tools</option>
                <option value="Sports">Sports</option>
                <option value="Clothing">Clothing</option>
                <option value="Others">Others</option>
              </select>
              <div class="field-error" id="err_category"></div>
            </div>

            <!-- Lender -->
            <div class="form-group">
              <label>Lender <span class="required">*</span></label>
              <select id="lender_id" class="form-control">
                <option value="">-- Select Lender --</option>
              </select>
              <div class="field-error" id="err_lender"></div>
            </div>

            <!-- Price & Stock -->
            <div class="form-row">
              <div class="form-group">
                <label>Price (₱) <span class="required">*</span></label>
                <input
                  type="number"
                  id="price"
                  class="form-control"
                  placeholder="0.00"
                  min="0.01"
                  step="0.01"
                />
                <div class="field-error" id="err_price"></div>
              </div>
              <div class="form-group">
                <label>Stock <span class="required">*</span></label>
                <input
                  type="number"
                  id="stock"
                  class="form-control"
                  placeholder="0"
                  min="0"
                />
                <div class="field-error" id="err_stock"></div>
              </div>
            </div>

            <!-- Description -->
            <div class="form-group">
              <label>Description</label>
              <textarea
                id="description"
                class="form-control"
                placeholder="Optional short description..."
                rows="3"
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeFormModal()">
            Cancel
          </button>
          <button class="btn btn-primary" id="saveBtn">Save Product</button>
        </div>
      </div>
    </div>

    <!-- ===== CONFIRM DELETE MODAL ===== -->
    <div class="modal-overlay" id="confirmModal">
      <div class="modal">
        <div class="modal-header">
          <h2>Confirm Deletion</h2>
          <button class="modal-close" onclick="closeConfirmModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="confirm-icon">🗑️</div>
          <p class="confirm-msg">
            Are you sure you want to delete <strong id="confirmName"></strong>?
          </p>
          <p class="confirm-sub">This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeConfirmModal()">
            Cancel
          </button>
          <button class="btn btn-danger" id="confirmDeleteBtn">
            Yes, Delete
          </button>
        </div>
      </div>
    </div>

    <!-- ===== TOAST NOTIFICATIONS ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/app.js"></script>
  </body>
</html>
