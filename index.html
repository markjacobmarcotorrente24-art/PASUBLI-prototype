<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PASUBLI — My Listings</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <header class="header">
      <h1>PASUBLI</h1>
      <span>My Product Listings</span>
    </header>

    <div class="container">

      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-label">My Listings</div>
          <div class="stat-value blue" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Categories</div>
          <div class="stat-value green" id="statCategories">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Stock</div>
          <div class="stat-value yellow" id="statStock">—</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">My Listings</div>

        <div class="toolbar">
          <input type="text" id="searchInput" placeholder="Search by category..." />
          <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Formal Wear">Formal Wear</option>
            <option value="Casual Wear">Casual Wear</option>
            <option value="Business Casual">Business Casual</option>
            <option value="Office Wear">Office Wear</option>
            <option value="Sports">Sports</option>
            <option value="Loungewear">Loungewear</option>
            <option value="Others">Others</option>
          </select>
          <div class="toolbar-right">
            <button class="btn btn-primary" id="addBtn">+ Add Listing</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Product ID</th>
                <th>Category</th>
                <th>Rental Price</th>
                <th>Stock Qty</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr>
                <td colspan="5" style="text-align:center;padding:30px;color:#64748b;">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal-overlay" id="formModal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="formModalTitle">Add New Listing</h2>
          <button class="modal-close" onclick="closeFormModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger" id="formAlert"></div>
          <form id="productForm" onsubmit="return false;">

            <div class="form-group">
              <label>Product ID <span class="required">*</span></label>
              <input type="text" id="product_id" class="form-control" placeholder="e.g., 10001" maxlength="5" />
              <div class="field-error" id="err_product_id"></div>
            </div>

            <div class="form-group">
              <label>Category <span class="required">*</span></label>
              <select id="category" class="form-control">
                <option value="">-- Select Category --</option>
                <option value="Formal Wear">Formal Wear</option>
                <option value="Casual Wear">Casual Wear</option>
                <option value="Business Casual">Business Casual</option>
                <option value="Office Wear">Office Wear</option>
                <option value="Sports">Sports</option>
                <option value="Loungewear">Loungewear</option>
                <option value="Others">Others</option>
              </select>
              <div class="field-error" id="err_category"></div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Rental Price (₱) <span class="required">*</span></label>
                <input type="number" id="rental_price" class="form-control" placeholder="0.00" min="0.01" step="0.01" />
                <div class="field-error" id="err_rental_price"></div>
              </div>
              <div class="form-group">
                <label>Stock Qty <span class="required">*</span></label>
                <input type="number" id="stock_qty" class="form-control" placeholder="0" min="0" />
                <div class="field-error" id="err_stock_qty"></div>
              </div>
            </div>

          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeFormModal()">Cancel</button>
          <button class="btn btn-primary" id="saveBtn">Save Listing</button>
        </div>
      </div>
    </div>

    <!-- CONFIRM DELETE MODAL -->
    <div class="modal-overlay" id="confirmModal">
      <div class="modal">
        <div class="modal-header">
          <h2>Confirm Deletion</h2>
          <button class="modal-close" onclick="closeConfirmModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="confirm-icon">🗑️</div>
          <p class="confirm-msg">Are you sure you want to delete <strong id="confirmName"></strong>?</p>
          <p class="confirm-sub">This action cannot be undone.</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
          <button class="btn btn-danger" id="confirmDeleteBtn">Yes, Delete</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="js/app.js"></script>
  </body>
</html>
